<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALLO-BRICALL</title>
  <script>
    (function() {
      var path = (window.location.pathname || '/');
      var lower = path.toLowerCase();
      var search = window.location.search || '';

      // حماية من الحلقة اللانهائية
      if (search.indexOf('_r=1') !== -1) { return; }

      // إذا كان الرابط ملف عندو امتداد (صورة/ملف) — ماتزيدش .html، رجّع للرئيسية
      if (/\.(webp|jpg|jpeg|png|gif|svg|pdf|css|js|ico|mp4|webm)$/i.test(lower)) {
        window.location.replace('/');
        return;
      }

      // الجذر مع زيادة انستجرام/فيسبوك → الرئيسية
      if (path === '/' || path === '' || lower.indexOf('index') !== -1) {
        window.location.replace('/');
        return;
      }

      // صفحة معروفة بزيادة ?... → نضيف .html (غير للصفحات، ماشي الملفات)
      var clean = lower.replace(/^\/+|\/+$/g, '');
      // إذا فيها نقطة (امتداد) ماتزيدش .html
      if (clean && clean.indexOf('.') === -1) {
        window.location.replace('/' + clean + '.html?_r=1');
        return;
      }

      window.location.replace('/');
    })();
  </script>
</head>
<body style="font-family:'Cairo',sans-serif; text-align:center; padding:60px 20px; background:#f5f0e8;">
  <h2 style="color:#1a1a2e;">ALLO-BRICALL</h2>
  <p style="color:#666;">⏳ جاري تحويلك للموقع...</p>
  <p style="margin-top:30px;">
    <a href="/" style="background:#e8b84b; color:#1a1a2e; padding:12px 28px; border-radius:8px; text-decoration:none; font-weight:bold;">
      → الذهاب للصفحة الرئيسية
    </a>
  </p>
</body>
</html>
