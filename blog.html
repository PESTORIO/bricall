<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مدونة ALLO-BRICALL — نصائح الحرفيين بالدار البيضاء</title>
  <meta name="description" content="مقالات ونصائح حول الحرفيين بالدار البيضاء — كهربائي، سباك، نجار، صباغ وأكثر" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #1a1a2e; --accent: #e8b84b; --bg: #f5f0e8;
      --card: #ffffff; --text: #1a1a2e; --muted: #6b6b7b;
      --border: #e0d8cc;
    }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* NAV */
    nav {
      background: var(--primary); padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .nav-logo { font-size: 20px; font-weight: 900; color: var(--accent); text-decoration: none; }
    .nav-logo span { color: white; }
    .nav-link { color: rgba(255,255,255,0.8); font-size: 13px; text-decoration: none; transition: color .2s; }
    .nav-link:hover { color: var(--accent); }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, #2a2a5e 100%);
      padding: 60px 24px 50px; text-align: center;
    }
    .hero-label { display: inline-block; background: var(--accent); color: var(--primary); font-size: 12px; font-weight: 900; padding: 4px 14px; border-radius: 20px; margin-bottom: 14px; }
    .hero h1 { font-size: 32px; font-weight: 900; color: white; margin-bottom: 10px; line-height: 1.3; }
    .hero p { font-size: 15px; color: rgba(255,255,255,0.7); max-width: 500px; margin: 0 auto; }

    /* FILTERS */
    .filters-wrap { background: white; border-bottom: 1px solid var(--border); padding: 14px 24px; position: sticky; top: 57px; z-index: 99; }
    .filters { display: flex; gap: 8px; max-width: 900px; margin: 0 auto; flex-wrap: wrap; align-items: center; }
    .filter-btn {
      padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--border);
      background: white; color: var(--muted); font-family: 'Cairo', sans-serif;
      font-size: 12px; font-weight: 700; cursor: pointer; transition: all .2s;
    }
    .filter-btn.active, .filter-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .search-wrap { margin-right: auto; }
    .search-input {
      border: 1.5px solid var(--border); border-radius: 20px;
      padding: 7px 16px; font-family: 'Cairo', sans-serif; font-size: 13px;
      outline: none; width: 200px; transition: border-color .2s;
    }
    .search-input:focus { border-color: var(--accent); }

    /* MAIN GRID */
    .main { max-width: 900px; margin: 0 auto; padding: 30px 20px; }
    .posts-count { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

    .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }

    /* CARD */
    .post-card {
      background: white; border-radius: 16px; overflow: hidden;
      border: 1px solid var(--border); cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      text-decoration: none; color: inherit; display: block;
    }
    .post-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
    .post-img { width: 100%; height: 170px; object-fit: cover; background: #f0ebe0; display: block; }
    .post-img-ph { width: 100%; height: 170px; background: linear-gradient(135deg, #f0ebe0, #e8ddd0); display: flex; align-items: center; justify-content: center; font-size: 40px; }
    .post-body { padding: 16px; }
    .post-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .post-specialty { background: #f0ebe0; color: var(--primary); font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
    .post-date { font-size: 11px; color: var(--muted); }
    .post-title { font-size: 15px; font-weight: 900; color: var(--text); margin-bottom: 8px; line-height: 1.4; }
    .post-excerpt { font-size: 12px; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .post-read-more { margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--accent); }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 1000; display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white; border-radius: 20px; max-width: 680px; width: 100%;
      max-height: 88vh; overflow-y: auto;
      animation: modalIn .25s ease;
    }
    @keyframes modalIn { from { opacity:0; transform: scale(.95); } to { opacity:1; transform: scale(1); } }
    .modal-img { width: 100%; max-height: 280px; object-fit: cover; border-radius: 20px 20px 0 0; display: block; }
    .modal-body { padding: 24px; }
    .modal-specialty { background: #f0ebe0; color: var(--primary); font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 12px; }
    .modal-title { font-size: 22px; font-weight: 900; color: var(--text); margin-bottom: 8px; line-height: 1.3; }
    .modal-date { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
    .modal-content { font-size: 14px; color: #444; line-height: 2; white-space: pre-wrap; }
    .modal-close {
      position: sticky; top: 0; float: left; background: var(--primary);
      color: white; border: none; border-radius: 0 0 12px 0;
      padding: 8px 14px; font-family: 'Cairo', sans-serif; font-size: 13px;
      cursor: pointer; font-weight: 700; z-index: 10;
    }
    .modal-divider { height: 1px; background: var(--border); margin: 18px 0; }

    /* CTA */
    .cta-section {
      background: var(--primary); border-radius: 20px; padding: 32px 24px;
      text-align: center; margin: 40px 0 20px;
    }
    .cta-section h3 { color: var(--accent); font-size: 20px; font-weight: 900; margin-bottom: 8px; }
    .cta-section p { color: rgba(255,255,255,0.75); font-size: 14px; margin-bottom: 18px; }
    .btn-cta {
      display: inline-block; background: var(--accent); color: var(--primary);
      padding: 12px 28px; border-radius: 12px; font-family: 'Cairo', sans-serif;
      font-size: 14px; font-weight: 900; text-decoration: none; transition: opacity .2s;
    }
    .btn-cta:hover { opacity: .85; }

    /* EMPTY / LOADING */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state div { font-size: 48px; margin-bottom: 12px; }
    .loading-state { text-align: center; padding: 60px; color: var(--muted); font-size: 14px; }

    /* FOOTER */
    footer { background: var(--primary); color: rgba(255,255,255,0.6); text-align: center; padding: 20px; font-size: 12px; margin-top: 40px; }
    footer a { color: var(--accent); text-decoration: none; }

    @media (max-width: 600px) {
      .hero h1 { font-size: 24px; }
      .posts-grid { grid-template-columns: 1fr; }
      .search-input { width: 140px; }
      .filters { gap: 6px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">ALLO<span>-BRICALL</span></a>
  <a class="nav-link" href="/">← العودة للموقع</a>
</nav>

<div class="hero">
  <div class="hero-label">📝 المدونة</div>
  <h1>نصائح ومقالات الحرفيين</h1>
  <p>كل ما تحتاج تعرفو قبل ما تختار حرفي بالدار البيضاء</p>
</div>

<div class="filters-wrap">
  <div class="filters">
    <button class="filter-btn active" onclick="filterBySpecialty('', this)">🔍 الكل</button>
    <button class="filter-btn" onclick="filterBySpecialty('electricien-casablanca', this)">⚡ كهربائي</button>
    <button class="filter-btn" onclick="filterBySpecialty('plombier-casablanca', this)">🔧 سباك</button>
    <button class="filter-btn" onclick="filterBySpecialty('menuisier-casablanca', this)">🪵 نجار</button>
    <button class="filter-btn" onclick="filterBySpecialty('peintre-casablanca', this)">🎨 صباغ</button>
    <button class="filter-btn" onclick="filterBySpecialty('aluminium-casablanca', this)">🪟 ألومنيوم</button>
    <button class="filter-btn" onclick="filterBySpecialty('platrier-casablanca', this)">🏗️ جبصي</button>
    <button class="filter-btn" onclick="filterBySpecialty('livreur-casablanca', this)">🚚 ناقل</button>
    <div class="search-wrap">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث..." oninput="onSearch()" />
    </div>
  </div>
</div>

<div class="main">
  <div class="posts-count" id="postsCount"></div>
  <div class="posts-grid" id="postsGrid">
    <div class="loading-state">⏳ جاري تحميل المقالات...</div>
  </div>

  <div class="cta-section">
    <h3>تحتاج حرفي الآن؟</h3>
    <p>اعثر على أفضل الحرفيين في الدار البيضاء في دقيقة واحدة</p>
    <a href="/" class="btn-cta">🔍 ابحث عن حرفي</a>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalBox">
    <button class="modal-close" onclick="closeModalBtn()">✖ إغلاق</button>
    <div id="modalContent"></div>
  </div>
</div>

<footer>
  <p>© 2025 <a href="/">ALLO-BRICALL</a> — جميع الحقوق محفوظة</p>
</footer>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDqF510_qVbJxImCP94Sl9uE7srF2u1Cuk",
    authDomain: "hrafiy-app.firebaseapp.com",
    projectId: "hrafiy-app",
    storageBucket: "hrafiy-app.firebasestorage.app",
    messagingSenderId: "668315848262",
    appId: "1:668315848262:web:0323e4f8c932e040c80447"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const SPECIALTY_LABELS = {
    'electricien-casablanca':'⚡ كهربائي','plombier-casablanca':'🔧 سباك',
    'menuisier-casablanca':'🪵 نجار','peintre-casablanca':'🎨 صباغ',
    'aluminium-casablanca':'🪟 ألومنيوم','platrier-casablanca':'🏗️ جبصي',
    'livreur-casablanca':'🚚 ناقل','autres':'🔨 أخرى'
  };

  let allPosts = [];
  let activeSpecialty = '';
  let searchQ = '';

  async function loadPosts() {
    try {
      const snap = await db.collection('blog_posts').orderBy('created_at', 'desc').get();
      allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      applyFilters();
    } catch(e) {
      document.getElementById('postsGrid').innerHTML =
        '<div class="empty-state"><div>⚠️</div><p>خطأ في التحميل</p></div>';
    }
  }

  function applyFilters() {
    let filtered = allPosts;
    if (activeSpecialty) filtered = filtered.filter(p => p.specialty === activeSpecialty);
    if (searchQ) {
      const q = searchQ.toLowerCase();
      filtered = filtered.filter(p =>
        (p.title||'').toLowerCase().includes(q) ||
        (p.content||'').toLowerCase().includes(q)
      );
    }
    renderPosts(filtered);
  }

  function filterBySpecialty(spec, btn) {
    activeSpecialty = spec;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }

  function onSearch() {
    searchQ = document.getElementById('searchInput').value.trim();
    applyFilters();
  }

  function renderPosts(posts) {
    const grid = document.getElementById('postsGrid');
    const count = document.getElementById('postsCount');
    count.textContent = posts.length + ' مقالة';

    if (!posts.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div>📭</div><p>لا توجد مقالات في هذه الفئة بعد</p></div>';
      return;
    }

    grid.innerHTML = posts.map(p => {
      const label = SPECIALTY_LABELS[p.specialty] || p.specialty || '';
      const date = p.created_at
        ? new Date(p.created_at.toDate ? p.created_at.toDate() : p.created_at)
            .toLocaleDateString('ar-MA', { year:'numeric', month:'long', day:'numeric' })
        : '';
      const excerpt = (p.content||'').slice(0, 120) + '...';
      const imgTag = p.image
        ? `<img src="${p.image}" class="post-img" alt="${p.title||''}" onerror="this.outerHTML='<div class=post-img-ph>📝</div>'">`
        : `<div class="post-img-ph">📝</div>`;
      return `
        <div class="post-card" onclick="openPost('${p.id}')">
          ${imgTag}
          <div class="post-body">
            <div class="post-meta">
              ${label ? `<span class="post-specialty">${label}</span>` : ''}
              ${date ? `<span class="post-date">📅 ${date}</span>` : ''}
            </div>
            <div class="post-title">${p.title||'بدون عنوان'}</div>
            <div class="post-excerpt">${excerpt}</div>
            <div class="post-read-more">اقرأ أكثر ←</div>
          </div>
        </div>`;
    }).join('');
  }

  function openPost(id) {
    const p = allPosts.find(x => x.id === id);
    if (!p) return;
    const label = SPECIALTY_LABELS[p.specialty] || p.specialty || '';
    const date = p.created_at
      ? new Date(p.created_at.toDate ? p.created_at.toDate() : p.created_at)
          .toLocaleDateString('ar-MA', { year:'numeric', month:'long', day:'numeric' })
      : '';
    const imgTag = p.image ? `<img src="${p.image}" class="modal-img" alt="${p.title||''}">` : '';

    document.getElementById('modalContent').innerHTML = `
      ${imgTag}
      <div class="modal-body">
        ${label ? `<span class="modal-specialty">${label}</span>` : ''}
        <div class="modal-title">${p.title||''}</div>
        ${date ? `<div class="modal-date">📅 ${date}</div>` : ''}
        <div class="modal-divider"></div>
        <div class="modal-content">${p.content||''}</div>
      </div>`;
    document.getElementById('modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModalBtn();
  }
  function closeModalBtn() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeModalBtn(); });

  loadPosts();
</script>
</body>
</html>
