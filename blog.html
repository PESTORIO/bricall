<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 مدونة ALLO-BRICALL - نصائح الحرفيين</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #1a1a2e; --accent: #e8b84b; --bg: #f5f0e8; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--primary); }
    
    .navbar {
      background: var(--primary);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar h1 { font-size: 20px; }
    .navbar a {
      background: var(--accent);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }
    .navbar a:hover { opacity: 0.9; }
    
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 16px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.3s;
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .filter-btn:hover { border-color: var(--accent); }
    
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    
    .article-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e0e0e0;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
    }
    .article-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    
    .article-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #f0f0f0;
    }
    
    .article-content {
      padding: 16px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    
    .article-specialty {
      background: #f0ebe0;
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      width: fit-content;
    }
    
    .article-title {
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 8px;
      color: var(--primary);
    }
    
    .article-excerpt {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 12px;
      flex-grow: 1;
    }
    
    .article-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #999;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
    }
    
    .cta-button {
      background: var(--accent);
      color: var(--primary);
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      transition: all 0.3s;
    }
    .cta-button:hover {
      background: #d4a23a;
      transform: scale(1.05);
    }
    
    .read-more {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }
    .read-more:hover { text-decoration: underline; }
    
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    
    .modal-content {
      background: white;
      border-radius: 12px;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }
    
    .modal-close {
      position: absolute;
      top: 15px;
      left: 15px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
    }
    
    .modal-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 16px;
      margin-top: 20px;
    }
    
    .modal-body {
      font-size: 14px;
      line-height: 1.8;
      color: #555;
      margin-bottom: 20px;
    }
    
    .cta-section {
      background: linear-gradient(135deg, var(--primary), #2a2a5e);
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      margin-top: 20px;
    }
    
    .cta-section h3 {
      margin-bottom: 10px;
      font-size: 16px;
    }
    
    .cta-section p {
      font-size: 13px;
      margin-bottom: 15px;
      opacity: 0.9;
    }
    
    .cta-link {
      display: inline-block;
      background: var(--accent);
      color: var(--primary);
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 900;
      transition: all 0.3s;
    }
    
    .cta-link:hover {
      background: #d4a23a;
      transform: scale(1.05);
    }
    
    .loading { text-align: center; color: #999; padding: 40px; }
    .empty { text-align: center; color: #999; padding: 40px; }
  </style>
</head>
<body>

<div class="navbar">
  <h1>📝 مدونة ALLO-BRICALL</h1>
  <a href="https://allo-bricall.ma">← العودة للموقع</a>
</div>

<div class="container">
  <div class="filters">
    <button class="filter-btn active" onclick="filterArticles('')">كل المقالات</button>
    <button class="filter-btn" onclick="filterArticles('⚡')">⚡ كهربائي</button>
    <button class="filter-btn" onclick="filterArticles('🔧')">🔧 سباك</button>
    <button class="filter-btn" onclick="filterArticles('🪵')">🪵 نجار</button>
    <button class="filter-btn" onclick="filterArticles('🎨')">🎨 صباغ</button>
  </div>

  <div id="articlesList" class="articles-grid">
    <div class="loading">⏳ جاري تحميل المقالات...</div>
  </div>
</div>

<!-- MODAL -->
<div id="articleModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2 class="modal-title" id="modalTitle"></h2>
    <div class="modal-body" id="modalBody"></div>
    
    <!-- CTA SECTION -->
    <div class="cta-section">
      <h3>🔧 المشكلة ما حلتش؟</h3>
      <p>اتصل بحرفي متخصص من ALLO-BRICALL الآن</p>
      <a href="javascript:goToArtisans()" class="cta-link">🤝 اتصل بالحرفي</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDqF510_qVbJxImCP94Sl9uE7srF2u1Cuk",
    authDomain: "hrafiy-app.firebaseapp.com",
    projectId: "hrafiy-app",
    storageBucket: "hrafiy-app.firebasestorage.app",
    messagingSenderId: "668315848262",
    appId: "1:668315848262:web:0323e4f8c932e040c80447"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  
  let allArticles = [];
  let currentSpecialty = '';
  
  async function loadArticles() {
    try {
      const snap = await db.collection('blog_posts').orderBy('created_at', 'desc').get();
      allArticles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderArticles();
    } catch(e) {
      console.error('Error:', e);
      document.getElementById('articlesList').innerHTML = '<div class="empty">خطأ في تحميل المقالات</div>';
    }
  }
  
  function filterArticles(specialty) {
    currentSpecialty = specialty;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    renderArticles();
  }
  
  function renderArticles() {
    const list = document.getElementById('articlesList');
    
    let filtered = allArticles;
    if (currentSpecialty) {
      filtered = allArticles.filter(a => a.specialty && a.specialty.includes(currentSpecialty));
    }
    
    if (!filtered.length) {
      list.innerHTML = '<div class="empty">لا توجد مقالات</div>';
      return;
    }
    
    list.innerHTML = filtered.map(article => `
      <div class="article-card">
        <img src="${article.image || 'https://via.placeholder.com/300x200'}" alt="${article.title}" class="article-image" onerror="this.src='https://via.placeholder.com/300x200'">
        <div class="article-content">
          <span class="article-specialty">${article.specialty || '📝'}</span>
          <h3 class="article-title">${article.title}</h3>
          <p class="article-excerpt">${(article.content || '').slice(0, 100)}...</p>
          <div class="article-footer">
            <span>📅 ${article.created_at ? new Date(article.created_at.toDate()).toLocaleDateString('ar-MA') : 'قريباً'}</span>
            <a class="read-more" onclick="openArticle('${article.id}', '${article.title.replace(/'/g, "\\'")}', '${article.specialty || ''}', '${article.content.replace(/'/g, "\\'").slice(0, 500)}')">اقرأ أكثر →</a>
          </div>
        </div>
      </div>
    `).join('');
  }
  
  function openArticle(id, title, specialty, excerpt) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = `
      <p><strong>${specialty}</strong></p>
      <p>${excerpt}...</p>
    `;
    document.getElementById('articleModal').classList.add('active');
  }
  
  function closeModal() {
    document.getElementById('articleModal').classList.remove('active');
  }
  
  function goToArtisans() {
    // اذهب لصفحة الحرفيين (سيتم إنشاؤها)
    window.location.href = 'artisans.html';
  }
  
  // Close modal on outside click
  document.getElementById('articleModal').addEventListener('click', (e) => {
    if (e.target.id === 'articleModal') closeModal();
  });
  
  // Load articles on page load
  loadArticles();
</script>

</body>
</html>
