<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ لوحة الإدارة - ALLO-BRICALL</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #1a1a2e; --accent: #e8b84b; --bg: #f5f0e8; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--primary); }
    
    .navbar { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .navbar h1 { font-size: 20px; }
    .navbar a { background: var(--accent); color: var(--primary); padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 700; }
    
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 700; margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
    }
    .form-group textarea { resize: vertical; min-height: 150px; }
    
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 14px; }
    .btn-save { background: var(--accent); color: var(--primary); }
    .btn-save:hover { opacity: 0.9; }
    
    .articles-list { margin-top: 30px; }
    .article-card { background: white; padding: 16px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #ddd; }
    .article-title { font-weight: 900; font-size: 16px; margin-bottom: 8px; }
    .article-excerpt { font-size: 13px; color: #666; margin-bottom: 8px; }
    .article-meta { font-size: 12px; color: #999; }
    
    .loading { text-align: center; color: #999; padding: 40px; }
  </style>
</head>
<body>

<div class="navbar">
  <h1>⚙️ لوحة إدارة المقالات</h1>
  <a href="https://allo-bricall.ma">← الموقع</a>
</div>

<div class="container">
  <!-- فورم إضافة مقالة -->
  <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
    <h2 style="margin-bottom: 16px;">📝 مقالة جديدة</h2>
    
    <div class="form-group">
      <label>العنوان *</label>
      <input type="text" id="title" placeholder="مثال: 5 مشاكل كهربائية منزلية">
    </div>
    
    <div class="form-group">
      <label>التخصص *</label>
      <select id="specialty">
        <option value="">اختر التخصص</option>
        <option value="⚡ كهربائي">⚡ كهربائي</option>
        <option value="🔧 سباك">🔧 سباك</option>
        <option value="🪵 نجار">🪵 نجار</option>
        <option value="🎨 صباغ">🎨 صباغ</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>رابط الصورة</label>
      <input type="url" id="image" placeholder="https://...">
    </div>
    
    <div class="form-group">
      <label>رابط صفحة الحرفيين *</label>
      <input type="text" id="artisanLink" placeholder="https://allo-bricall.ma/electricien-casablanca">
    </div>
    
    <div class="form-group">
      <label>محتوى المقالة *</label>
      <textarea id="content" placeholder="اكتب محتوى المقالة هنا..."></textarea>
    </div>
    
    <button class="btn btn-save" onclick="saveBlogPost()">💾 نشر المقالة</button>
  </div>
  
  <!-- قائمة المقالات -->
  <div class="articles-list">
    <h2 style="margin-bottom: 16px;">📚 المقالات المنشورة</h2>
    <div id="articlesList" class="loading">⏳ جاري التحميل...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDqF510_qVbJxImCP94Sl9uE7srF2u1Cuk",
    authDomain: "hrafiy-app.firebaseapp.com",
    projectId: "hrafiy-app",
    storageBucket: "hrafiy-app.firebasestorage.app",
    messagingSenderId: "668315848262",
    appId: "1:668315848262:web:0323e4f8c932e040c80447"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  
  // حفظ المقالة
  async function saveBlogPost() {
    const title = document.getElementById('title').value.trim();
    const specialty = document.getElementById('specialty').value;
    const image = document.getElementById('image').value.trim();
    const artisanLink = document.getElementById('artisanLink').value.trim();
    const content = document.getElementById('content').value.trim();
    
    if (!title || !specialty || !content || !artisanLink) {
      alert('يرجى ملء جميع الحقول المطلوبة');
      return;
    }
    
    try {
      await db.collection('blog_posts').add({
        title,
        specialty,
        image,
        artisanLink,
        content,
        created_at: firebase.firestore.FieldValue.serverTimestamp()
      });
      
      alert('✅ تم نشر المقالة بنجاح!');
      document.getElementById('title').value = '';
      document.getElementById('specialty').value = '';
      document.getElementById('image').value = '';
      document.getElementById('artisanLink').value = '';
      document.getElementById('content').value = '';
      loadArticles();
    } catch(e) {
      console.error('Error:', e);
      alert('❌ خطأ: ' + e.message);
    }
  }
  
  // تحميل المقالات
  async function loadArticles() {
    try {
      const snap = await db.collection('blog_posts').orderBy('created_at', 'desc').get();
      const articles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      
      const list = document.getElementById('articlesList');
      if (!articles.length) {
        list.innerHTML = '<div class="loading">لا توجد مقالات بعد</div>';
        return;
      }
      
      list.innerHTML = articles.map(a => `
        <div class="article-card">
          <div class="article-title">${a.title}</div>
          <div style="font-size: 12px; margin-bottom: 8px;">
            <span style="background: #f0ebe0; padding: 4px 8px; border-radius: 4px;">${a.specialty}</span>
          </div>
          <div class="article-excerpt">${(a.content || '').slice(0, 100)}...</div>
          <div class="article-meta">
            📅 ${a.created_at ? new Date(a.created_at.toDate()).toLocaleDateString('ar-MA') : 'قريباً'} | 
            🔗 ${a.artisanLink || 'بدون رابط'}
          </div>
        </div>
      `).join('');
    } catch(e) {
      console.error('Error:', e);
      document.getElementById('articlesList').innerHTML = '<div class="loading">خطأ في التحميل</div>';
    }
  }
  
  // تحميل المقالات عند فتح الصفحة
  loadArticles();
</script>

</body>
</html>
