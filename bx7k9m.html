<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ ALLO-BRICALL Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #1a1a2e; --accent: #e8b84b; --bg: #f5f0e8; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--primary); }
    
    /* LOGIN */
    #loginPage {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--primary), #2a2a5e);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 380px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    .login-card h1 { font-size: 28px; margin-bottom: 10px; }
    .login-card p { color: #888; margin-bottom: 30px; }
    .login-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
    }
    .login-card button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
    }
    .login-card button:hover { background: #2a2a5e; }
    
    /* MAIN */
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .header {
      background: var(--primary);
      color: white;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header h1 { font-size: 24px; }
    .header button { padding: 8px 16px; background: var(--accent); color: var(--primary); border: none; border-radius: 8px; cursor: pointer; font-weight: 700; }
    
    /* TABS */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0d8cc;
      overflow-x: auto;
      flex-wrap: wrap;
    }
    .tab {
      padding: 12px 20px;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .tab:hover { color: var(--accent); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    
    /* SECTIONS */
    .section { display: none; }
    .section.active { display: block; }
    .card {
      background: white;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      padding: 20px;
      margin-bottom: 15px;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
    }
    
    button {
      padding: 10px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
    }
    button:hover { background: #2a2a5e; }
    button.danger { background: #dc3545; }
    button.danger:hover { background: #c82333; }
    
    .list-item {
      padding: 12px;
      background: #f9f9f9;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .loading { text-align: center; color: #999; padding: 20px; }
  </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
  <div class="login-card">
    <h1>⚙️ لوحة التحكم</h1>
    <p>أدخل كلمة السر</p>
    <input type="password" id="passInput" placeholder="كلمة السر" onkeydown="if(event.key==='Enter') doLogin()">
    <button onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- MAIN DASHBOARD -->
<div id="dashboard" style="display: none;">
  <div class="container">
    <div class="header">
      <h1>⚙️ لوحة التحكم</h1>
      <button onclick="doLogout()">🚪 تسجيل الخروج</button>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('dashboard', this)">📊 لوحة التحكم</button>
      <button class="tab" onclick="switchTab('artisans', this)">👷 الحرفيون</button>
      <button class="tab" onclick="switchTab('payments', this)">💰 المدفوعات</button>
      <button class="tab" onclick="switchTab('requests', this)">📋 الطلبات</button>
      <button class="tab" onclick="switchTab('calls', this)">📞 المكالمات</button>
      <button class="tab" onclick="switchTab('chats', this)">💬 الشات</button>
      <button class="tab" onclick="switchTab('earnings', this)">📊 الأرباح</button>
      <button class="tab" onclick="switchTab('map', this)">🗺️ الخريطة</button>
      <button class="tab" onclick="switchTab('blog', this)">📝 البلوغ</button>
    </div>

    <!-- DASHBOARD TAB -->
    <div id="dashboard-tab" class="section active">
      <div class="card">
        <h2>📊 الإحصائيات</h2>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px;">
          <div style="background: #f0f0f0; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 32px; font-weight: 900;">-</div>
            <div style="font-size: 12px; color: #666;">الحرفيون</div>
          </div>
          <div style="background: #f0f0f0; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 32px; font-weight: 900;">-</div>
            <div style="font-size: 12px; color: #666;">المكالمات</div>
          </div>
          <div style="background: #f0f0f0; padding: 20px; border-radius: 8px; text-align: center;">
            <div style="font-size: 32px; font-weight: 900;">-</div>
            <div style="font-size: 12px; color: #666;">المقالات</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ARTISANS TAB -->
    <div id="artisans-tab" class="section">
      <div class="card">
        <h2>👷 الحرفيون</h2>
        <h3 style="margin-top: 20px; margin-bottom: 10px;">إضافة حرفي</h3>
        <input type="text" id="artisanName" placeholder="الاسم">
        <input type="tel" id="artisanPhone" placeholder="الهاتف">
        <select id="artisanSpec">
          <option>⚡ كهربائي</option>
          <option>🔧 سباك</option>
          <option>🪵 نجار</option>
          <option>🎨 صباغ</option>
        </select>
        <button onclick="addArtisan()">➕ إضافة</button>
        <div id="artisansList" style="margin-top: 20px;"></div>
      </div>
    </div>

    <!-- PAYMENTS TAB -->
    <div id="payments-tab" class="section">
      <div class="card">
        <h2>💰 المدفوعات</h2>
        <div class="loading">قريباً...</div>
      </div>
    </div>

    <!-- REQUESTS TAB -->
    <div id="requests-tab" class="section">
      <div class="card">
        <h2>📋 الطلبات</h2>
        <div class="loading">قريباً...</div>
      </div>
    </div>

    <!-- CALLS TAB -->
    <div id="calls-tab" class="section">
      <div class="card">
        <h2>📞 المكالمات</h2>
        <div class="loading">قريباً...</div>
      </div>
    </div>

    <!-- CHATS TAB -->
    <div id="chats-tab" class="section">
      <div class="card">
        <h2>💬 الشات</h2>
        <div class="loading">قريباً...</div>
      </div>
    </div>

    <!-- EARNINGS TAB -->
    <div id="earnings-tab" class="section">
      <div class="card">
        <h2>📊 الأرباح</h2>
        <div class="loading">قريباً...</div>
      </div>
    </div>

    <!-- MAP TAB -->
    <div id="map-tab" class="section">
      <div class="card">
        <h2>🗺️ الخريطة</h2>
        <div class="loading">قريباً...</div>
      </div>
    </div>

    <!-- BLOG TAB -->
    <div id="blog-tab" class="section">
      <div class="card">
        <h2>📝 البلوغ</h2>
        <h3 style="margin-top: 20px; margin-bottom: 10px;">مقالة جديدة</h3>
        <input type="text" id="blogTitle" placeholder="العنوان">
        <select id="blogSpec">
          <option>⚡ كهربائي</option>
          <option>🔧 سباك</option>
          <option>🪵 نجار</option>
        </select>
        <textarea id="blogContent" rows="6" placeholder="المحتوى..."></textarea>
        <button onclick="saveBlog()">💾 نشر</button>
        <div id="blogList" style="margin-top: 20px;"></div>
      </div>
    </div>

  </div>
</div>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyDqF510_qVbJxImCP94Sl9uE7srF2u1Cuk",
    authDomain: "hrafiy-app.firebaseapp.com",
    projectId: "hrafiy-app",
    storageBucket: "hrafiy-app.firebasestorage.app",
    messagingSenderId: "668315848262",
    appId: "1:668315848262:web:0323e4f8c932e040c80447"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ════════════════════════════════
  // LOGIN / LOGOUT
  // ════════════════════════════════
  function doLogin() {
    const pass = document.getElementById('passInput').value;
    if (pass === '1234') {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
    } else {
      alert('❌ كلمة السر خاطئة');
    }
  }

  function doLogout() {
    if (confirm('واش متأكد تخرج؟')) {
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('passInput').value = '';
    }
  }

  // ════════════════════════════════
  // TAB SWITCHING
  // ════════════════════════════════
  function switchTab(tabName, btn) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tabName + '-tab').classList.add('active');
    btn.classList.add('active');
    
    if (tabName === 'blog') loadBlog();
  }

  // ════════════════════════════════
  // ARTISANS
  // ════════════════════════════════
  async function addArtisan() {
    const name = document.getElementById('artisanName').value;
    const phone = document.getElementById('artisanPhone').value;
    const spec = document.getElementById('artisanSpec').value;
    
    if (!name || !phone) {
      alert('ملا الاسم والهاتف');
      return;
    }
    
    try {
      await db.collection('artisans').add({
        name, phone, specialty: spec,
        created_at: firebase.firestore.FieldValue.serverTimestamp()
      });
      alert('✅ تم الإضافة!');
      document.getElementById('artisanName').value = '';
      document.getElementById('artisanPhone').value = '';
      loadArtisans();
    } catch (e) {
      alert('❌ ' + e.message);
    }
  }

  async function loadArtisans() {
    try {
      const snap = await db.collection('artisans').get();
      const list = document.getElementById('artisansList');
      
      if (snap.empty) {
        list.innerHTML = '<div class="loading">لا يوجد حرفيون</div>';
        return;
      }
      
      list.innerHTML = snap.docs.map(doc => {
        const d = doc.data();
        return `
          <div class="list-item">
            <div><strong>${d.name}</strong><br><small>${d.specialty} • ${d.phone}</small></div>
            <button class="danger" onclick="deleteDoc('artisans','${doc.id}')">🗑️</button>
          </div>`;
      }).join('');
    } catch (e) {
      console.error(e);
    }
  }

  // ════════════════════════════════
  // BLOG
  // ════════════════════════════════
  async function saveBlog() {
    const title = document.getElementById('blogTitle').value;
    const spec = document.getElementById('blogSpec').value;
    const content = document.getElementById('blogContent').value;
    
    if (!title || !content) {
      alert('ملا العنوان والمحتوى');
      return;
    }
    
    try {
      await db.collection('blog_posts').add({
        title, specialty: spec, content,
        created_at: firebase.firestore.FieldValue.serverTimestamp()
      });
      alert('✅ تم النشر!');
      document.getElementById('blogTitle').value = '';
      document.getElementById('blogContent').value = '';
      loadBlog();
    } catch (e) {
      alert('❌ ' + e.message);
    }
  }

  async function loadBlog() {
    try {
      const snap = await db.collection('blog_posts').orderBy('created_at', 'desc').get();
      const list = document.getElementById('blogList');
      
      if (snap.empty) {
        list.innerHTML = '<div class="loading">لا يوجد مقالات</div>';
        return;
      }
      
      list.innerHTML = snap.docs.map(doc => {
        const d = doc.data();
        return `
          <div class="list-item">
            <div><strong>${d.title}</strong><br><small>${d.specialty}</small></div>
            <button class="danger" onclick="deleteDoc('blog_posts','${doc.id}')">🗑️</button>
          </div>`;
      }).join('');
    } catch (e) {
      console.error(e);
    }
  }

  // ════════════════════════════════
  // GENERAL
  // ════════════════════════════════
  async function deleteDoc(collection, id) {
    if (!confirm('واش متأكد تحذف؟')) return;
    try {
      await db.collection(collection).doc(id).delete();
      if (collection === 'artisans') loadArtisans();
      if (collection === 'blog_posts') loadBlog();
    } catch (e) {
      alert('❌ ' + e.message);
    }
  }

  // ════════════════════════════════
  // WINDOW EXPORTS
  // ════════════════════════════════
  window.doLogin = doLogin;
  window.doLogout = doLogout;
  window.switchTab = switchTab;
  window.addArtisan = addArtisan;
  window.loadArtisans = loadArtisans;
  window.saveBlog = saveBlog;
  window.loadBlog = loadBlog;
  window.deleteDoc = deleteDoc;
</script>

</body>
</html>
