<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الأعطال والأسعار — حرفي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #1a1a2e; --accent: #e8b84b; --bg: #f5f0e8; --card: #ffffff; --text: #1a1a2e; --muted: #6b6b7b; --border: #e0d8cc; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    nav { background: var(--primary); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
    .back-btn { color: white; text-decoration: none; font-size: 20px; }
    .logo { font-size: 22px; font-weight: 900; color: var(--accent); }
    .logo span { color: white; }

    .hero { background: var(--primary); padding: 32px 24px; text-align: center; }
    .hero h1 { font-size: 24px; font-weight: 900; color: white; margin-bottom: 8px; }
    .hero h1 span { color: var(--accent); }
    .hero p { font-size: 14px; color: rgba(255,255,255,0.7); }

    .container { max-width: 700px; margin: 0 auto; padding: 24px 16px; }

    /* SPECIALTY TABS */
    .tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px; }
    .tab { padding: 10px 20px; border-radius: 20px; border: 2px solid var(--border); background: var(--card); font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    .tab:hover { border-color: var(--accent); }

    /* PROBLEMS LIST */
    .problems-grid { display: flex; flex-direction: column; gap: 12px; }
    .problem-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
    .problem-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    .problem-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .problem-info p { font-size: 13px; color: var(--muted); }
    .problem-price { text-align: left; }
    .price-from { font-size: 11px; color: var(--muted); }
    .price-amount { font-size: 20px; font-weight: 900; color: var(--primary); }
    .price-call { font-size: 13px; font-weight: 700; color: var(--accent); }
    .arrow { font-size: 20px; color: var(--accent); margin-right: 12px; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 20px; padding: 32px 24px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { font-size: 20px; font-weight: 900; }
    .btn-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--muted); }
    .modal-price-box { background: #f0ebe0; border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 20px; }
    .modal-price-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .modal-price { font-size: 28px; font-weight: 900; color: var(--primary); }
    .modal-subtitle { font-size: 16px; font-weight: 700; margin-bottom: 12px; }

    /* ARTISAN CARDS IN MODAL */
    .artisan-item { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.2s; }
    .artisan-item:hover { border-color: var(--accent); }
    .artisan-item-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--accent); font-weight: 900; flex-shrink: 0; }
    .artisan-item-info { flex: 1; }
    .artisan-item-info h4 { font-size: 15px; font-weight: 700; }
    .artisan-item-info p { font-size: 12px; color: var(--muted); }
    .artisan-item-stars { font-size: 14px; color: var(--accent); }
    .btn-call-small { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block; }
    .no-artisans { text-align: center; padding: 24px; color: var(--muted); font-size: 14px; }
    .loading-artisans { text-align: center; padding: 20px; color: var(--muted); }

    footer { background: var(--primary); color: rgba(255,255,255,0.6); text-align: center; padding: 24px; font-size: 13px; margin-top: 32px; }
    footer span { color: var(--accent); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="back-btn">←</a>
    <div class="logo">حرفي<span>.</span></div>
  </nav>

  <div class="hero">
    <h1>الأعطال و<span>الأسعار</span></h1>
    <p>اختر تخصصاً ثم اضغط على عطلك لتجد الحرفي المناسب</p>
  </div>

  <div class="container">
    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" onclick="showCategory('كهربائي', this)">⚡ كهربائي</button>
      <button class="tab" onclick="showCategory('سبّاك', this)">🔧 سبّاك</button>
      <button class="tab" onclick="showCategory('نجار خشب', this)">🪵 نجار خشب</button>
      <button class="tab" onclick="showCategory('ألومنيوم', this)">🪟 ألومنيوم</button>
      <button class="tab" onclick="showCategory('إصلاح تلفاز', this)">📺 تلفاز</button>
    </div>

    <!-- PROBLEMS -->
    <div class="problems-grid" id="problemsGrid"></div>
  </div>

  <footer>صُنع بـ ❤️ للمغرب — <span>حرفي</span> © 2026</footer>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle"></div>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-price-box">
        <div class="modal-price-label">ثمن الافتتاح</div>
        <div class="modal-price" id="modalPrice"></div>
      </div>
      <div class="modal-subtitle">🔍 الحرفيون المتاحون</div>
      <div id="artisansList"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDqF510_qVbJxImCP94Sl9uE7srF2u1Cuk",
      authDomain: "hrafiy-app.firebaseapp.com",
      projectId: "hrafiy-app",
      storageBucket: "hrafiy-app.firebasestorage.app",
      messagingSenderId: "668315848262",
      appId: "1:668315848262:web:0323e4f8c932e040c80447"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // قائمة الأعطال والأسعار
    const problems = {
      'كهربائي': [
        { name: 'تركيب لمبة', desc: 'تركيب أو تغيير لمبة', price: 50, call: false },
        { name: 'تغيير قاطع', desc: 'تغيير قاطع كهربائي', price: 80, call: false },
        { name: 'تركيب مقبس', desc: 'تركيب مقبس جديد', price: 60, call: false },
        { name: 'مشكل كهرباء عام', desc: 'أعطال كهربائية معقدة', price: 0, call: true },
      ],
      'سبّاك': [
        { name: 'تسرب ماء', desc: 'إصلاح تسرب في الأنابيب', price: 100, call: false },
        { name: 'انسداد', desc: 'فتح انسداد المجاري', price: 80, call: false },
        { name: 'تركيب صنبور', desc: 'تركيب أو تغيير صنبور', price: 70, call: false },
        { name: 'مشكل عام', desc: 'أعطال السباكة المعقدة', price: 0, call: true },
      ],
      'نجار خشب': [
        { name: 'إصلاح باب', desc: 'إصلاح باب خشبي', price: 100, call: false },
        { name: 'تركيب خزانة', desc: 'تركيب خزانة أو رف', price: 150, call: false },
        { name: 'مشكل عام', desc: 'أعمال النجارة المعقدة', price: 0, call: true },
      ],
      'ألومنيوم': [
        { name: 'إصلاح نافذة', desc: 'إصلاح نافذة ألومنيوم', price: 120, call: false },
        { name: 'تركيب باب', desc: 'تركيب باب ألومنيوم', price: 200, call: false },
        { name: 'مشكل عام', desc: 'أعمال الألومنيوم المعقدة', price: 0, call: true },
      ],
      'إصلاح تلفاز': [
        { name: 'إصلاح تلفاز', desc: 'جميع أعطال التلفاز', price: 0, call: true },
        { name: 'إصلاح ستالايت', desc: 'أعطال الاستقبال والدش', price: 0, call: true },
        { name: 'إصلاح أجهزة إلكترونية', desc: 'أجهزة منزلية متنوعة', price: 0, call: true },
      ],
    };

    let currentSpecialty = 'كهربائي';

    function showCategory(specialty, btn) {
      currentSpecialty = specialty;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderProblems(specialty);
    }

    function renderProblems(specialty) {
      const list = problems[specialty] || [];
      document.getElementById('problemsGrid').innerHTML = list.map((p, i) => `
        <div class="problem-card" onclick="openModal('${p.name}', ${p.price}, ${p.call}, '${specialty}')">
          <div class="problem-info">
            <h3>${p.name}</h3>
            <p>${p.desc}</p>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="problem-price">
              ${p.call
                ? `<div class="price-call">📞 عند الاتصال</div>`
                : `<div class="price-from">من</div><div class="price-amount">${p.price} درهم</div>`
              }
            </div>
            <div class="arrow">←</div>
          </div>
        </div>
      `).join('');
    }

    async function openModal(name, price, call, specialty) {
      document.getElementById('modalTitle').textContent = name;
      document.getElementById('modalPrice').textContent = call ? '📞 عند الاتصال' : `من ${price} درهم`;
      document.getElementById('artisansList').innerHTML = '<div class="loading-artisans">⏳ جاري البحث عن الحرفيين...</div>';
      document.getElementById('modalOverlay').classList.add('active');

      try {
        const snapshot = await db.collection("artisans")
          .where("specialty", "==", specialty)
          .where("status", "==", "active")
          .get();

        const artisans = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        artisans.sort((a,b) => (b.stars||1) - (a.stars||1));

        if (!artisans.length) {
          document.getElementById('artisansList').innerHTML = '<div class="no-artisans">لا يوجد حرفيون متاحون في هذا التخصص حالياً</div>';
          return;
        }

        document.getElementById('artisansList').innerHTML = artisans.map(a => `
          <div class="artisan-item">
            <div class="artisan-item-avatar">${(a.name||'ح')[0]}</div>
            <div class="artisan-item-info">
              <h4>${a.name||''}</h4>
              <p>📍 ${a.city||''}</p>
              <div class="artisan-item-stars">${'★'.repeat(a.stars||1)}${'☆'.repeat(5-(a.stars||1))}</div>
            </div>
            <a href="tel:${a.phone}" class="btn-call-small">📞 اتصل</a>
          </div>
        `).join('');
      } catch(e) {
        document.getElementById('artisansList').innerHTML = '<div class="no-artisans">حدث خطأ في التحميل</div>';
      }
    }

    function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
    function closeModalOutside(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

    // تحميل أول تخصص
    renderProblems('كهربائي');
  </script>
</body>
</html>
