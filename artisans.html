<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔧 الحرفيون - ALLO-BRICALL</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #1a1a2e; --accent: #e8b84b; --bg: #f5f0e8; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--primary); }
    
    .navbar {
      background: var(--primary);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar h1 { font-size: 20px; }
    .navbar a {
      background: var(--accent);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
    }
    
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 16px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.3s;
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    
    .artisans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    
    .artisan-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e0e0e0;
      transition: all 0.3s;
    }
    .artisan-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    
    .artisan-header {
      background: linear-gradient(135deg, var(--primary), #2a2a5e);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .artisan-name {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    
    .artisan-specialty {
      font-size: 14px;
      background: rgba(255,255,255,0.2);
      padding: 4px 12px;
      border-radius: 12px;
      display: inline-block;
    }
    
    .artisan-body {
      padding: 16px;
    }
    
    .artisan-info {
      margin-bottom: 12px;
      font-size: 13px;
    }
    
    .artisan-info strong {
      display: block;
      color: var(--primary);
      margin-bottom: 4px;
    }
    
    .rating {
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 12px;
    }
    
    .cta-button {
      width: 100%;
      background: var(--accent);
      color: var(--primary);
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 900;
      font-size: 14px;
      transition: all 0.3s;
    }
    .cta-button:hover {
      background: #d4a23a;
      transform: scale(1.02);
    }
    
    .loading { text-align: center; color: #999; padding: 40px; }
    .empty { text-align: center; color: #999; padding: 40px; }
  </style>
</head>
<body>

<div class="navbar">
  <h1>🔧 الحرفيون المتخصصون</h1>
  <a href="blog.html">← الرجوع للمقالات</a>
</div>

<div class="container">
  <div class="filters">
    <button class="filter-btn active" onclick="filterArtisans('')">كل الحرفيين</button>
    <button class="filter-btn" onclick="filterArtisans('⚡')">⚡ كهربائي</button>
    <button class="filter-btn" onclick="filterArtisans('🔧')">🔧 سباك</button>
    <button class="filter-btn" onclick="filterArtisans('🪵')">🪵 نجار</button>
    <button class="filter-btn" onclick="filterArtisans('🎨')">🎨 صباغ</button>
  </div>

  <div id="artisansList" class="artisans-grid">
    <div class="loading">⏳ جاري تحميل الحرفيين...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDqF510_qVbJxImCP94Sl9uE7srF2u1Cuk",
    authDomain: "hrafiy-app.firebaseapp.com",
    projectId: "hrafiy-app",
    storageBucket: "hrafiy-app.firebasestorage.app",
    messagingSenderId: "668315848262",
    appId: "1:668315848262:web:0323e4f8c932e040c80447"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  
  let allArtisans = [];
  let currentFilter = '';
  
  async function loadArtisans() {
    try {
      const snap = await db.collection('artisans').get();
      allArtisans = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderArtisans();
    } catch(e) {
      console.error('Error:', e);
      document.getElementById('artisansList').innerHTML = '<div class="empty">خطأ في تحميل الحرفيين</div>';
    }
  }
  
  function filterArtisans(specialty) {
    currentFilter = specialty;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    renderArtisans();
  }
  
  function renderArtisans() {
    const list = document.getElementById('artisansList');
    
    let filtered = allArtisans;
    if (currentFilter) {
      filtered = allArtisans.filter(a => a.specialty && a.specialty.includes(currentFilter));
    }
    
    if (!filtered.length) {
      list.innerHTML = '<div class="empty">لا يوجد حرفيون في هذا التخصص</div>';
      return;
    }
    
    list.innerHTML = filtered.map(artisan => `
      <div class="artisan-card">
        <div class="artisan-header">
          <div class="artisan-name">${artisan.name || 'حرفي'}</div>
          <div class="artisan-specialty">${artisan.specialty || '🔨 حرفي'}</div>
        </div>
        <div class="artisan-body">
          <div class="rating">⭐ ${artisan.rank_manual || 5}/10</div>
          <div class="artisan-info">
            <strong>📞 الهاتف:</strong>
            <a href="tel:${artisan.phone}" style="color: var(--accent); text-decoration: none; font-weight: 700;">
              ${artisan.phone || 'غير متوفر'}
            </a>
          </div>
          <div class="artisan-info">
            <strong>📍 المدينة:</strong>
            ${artisan.city || 'الدار البيضاء'}
          </div>
          <button class="cta-button" onclick="callArtisan('${artisan.phone}', '${artisan.name}')">
            📞 اتصل الآن
          </button>
        </div>
      </div>
    `).join('');
  }
  
  function callArtisan(phone, name) {
    if (phone && phone !== 'undefined') {
      window.location.href = `tel:${phone}`;
    } else {
      alert('رقم الهاتف غير متوفر');
    }
  }
  
  loadArtisans();
</script>

</body>
</html>
