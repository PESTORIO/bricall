<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عروض الحرفيين — حرفي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #1a1a2e; --accent: #e8b84b; --bg: #f5f0e8; --card: #ffffff; --text: #1a1a2e; --muted: #6b6b7b; --border: #e0d8cc; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav { background: var(--primary); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
    .back-btn { color: white; text-decoration: none; font-size: 20px; }
    .logo { font-size: 22px; font-weight: 900; color: var(--accent); }
    .logo span { color: white; }
    .hero { background: var(--primary); padding: 28px 24px; text-align: center; }
    .hero h1 { font-size: 22px; font-weight: 900; color: white; margin-bottom: 6px; }
    .hero h1 span { color: var(--accent); }
    .hero p { font-size: 13px; color: rgba(255,255,255,0.7); }
    .container { max-width: 700px; margin: 0 auto; padding: 24px 16px; }
    .request-info { background: white; border-radius: 14px; padding: 18px; margin-bottom: 20px; border: 1px solid var(--border); }
    .request-info h3 { font-size: 16px; font-weight: 900; margin-bottom: 6px; }
    .request-info p { font-size: 13px; color: var(--muted); }
    .section-title { font-size: 18px; font-weight: 900; margin-bottom: 14px; }
    .offer-card { background: white; border: 2px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 14px; transition: all 0.2s; }
    .offer-card.best { border-color: var(--accent); }
    .best-badge { display: inline-block; background: var(--accent); color: var(--primary); padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-bottom: 10px; }
    .offer-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .offer-avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--accent); font-weight: 900; flex-shrink: 0; }
    .offer-name { font-size: 16px; font-weight: 700; }
    .offer-city { font-size: 12px; color: var(--muted); }
    .offer-stars { color: var(--accent); font-size: 14px; }
    .offer-details { display: flex; gap: 16px; margin-bottom: 14px; }
    .offer-detail { text-align: center; background: #f0ebe0; padding: 10px 16px; border-radius: 10px; flex: 1; }
    .offer-detail-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .offer-detail-value { font-size: 18px; font-weight: 900; }
    .btn-call { width: 100%; padding: 13px; background: var(--primary); color: white; border: none; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; display: block; text-align: center; }
    .btn-call:hover { background: #2a2a4e; }
    .empty-msg { text-align: center; padding: 48px 24px; color: var(--muted); }
    .empty-msg .big { font-size: 40px; margin-bottom: 12px; }
    .empty-msg p { font-size: 15px; margin-bottom: 6px; }
    .empty-msg small { font-size: 13px; }
    .refresh-btn { margin-top: 16px; padding: 10px 24px; background: var(--accent); color: var(--primary); border: none; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }
    footer { background: var(--primary); color: rgba(255,255,255,0.6); text-align: center; padding: 24px; font-size: 13px; margin-top: 32px; }
    footer span { color: var(--accent); }
  </style>
</head>
<body>

<nav>
  <a href="problems.html" class="back-btn">←</a>
  <div class="logo">حرفي<span>.</span></div>
</nav>

<div class="hero">
  <h1>عروض <span>الحرفيين</span></h1>
  <p>اختر الحرفي المناسب واتصل به مباشرة</p>
</div>

<div class="container">
  <div id="requestInfo" class="request-info" style="display:none;"></div>
  <div id="offersSection">
    <div class="empty-msg"><div class="big">⏳</div><p>جاري التحميل...</p></div>
  </div>
</div>

<footer>صُنع بـ ❤️ للمغرب — <span>حرفي</span> © 2026</footer>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDqF510_qVbJxImCP94Sl9uE7srF2u1Cuk",
    authDomain: "hrafiy-app.firebaseapp.com",
    projectId: "hrafiy-app",
    storageBucket: "hrafiy-app.firebasestorage.app",
    messagingSenderId: "668315848262",
    appId: "1:668315848262:web:0323e4f8c932e040c80447"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const params = new URLSearchParams(window.location.search);
  const requestId = params.get('id');
  const clientPhone = params.get('phone');

  async function loadOffers() {
    if (!requestId) {
      document.getElementById('offersSection').innerHTML = '<div class="empty-msg"><p>رابط غير صحيح</p></div>';
      return;
    }

    try {
      // معلومات الطلب
      const reqDoc = await db.collection("requests").doc(requestId).get();
      if (reqDoc.exists) {
        const r = reqDoc.data();
        document.getElementById('requestInfo').style.display = 'block';
        document.getElementById('requestInfo').innerHTML = `
          <h3>📋 طلبك: ${r.problem}</h3>
          <p>📍 ${r.city} &nbsp;|&nbsp; تخصص: ${r.specialty}</p>
          ${r.note ? `<p style="margin-top:6px;">💬 ${r.note}</p>` : ''}
        `;
      }

      // العروض
      const snap = await db.collection("offers").where("request_id", "==", requestId).orderBy("price", "asc").get();
      const offers = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      if (!offers.length) {
        document.getElementById('offersSection').innerHTML = `
          <div class="empty-msg">
            <div class="big">🕐</div>
            <p>لا توجد عروض بعد</p>
            <small>الحرفيون سيرسلون عروضهم قريباً — ارجع لاحقاً</small>
            <br/>
            <button class="refresh-btn" onclick="loadOffers()">🔄 تحديث</button>
          </div>`;
        return;
      }

      document.getElementById('offersSection').innerHTML = `
        <div class="section-title">📩 ${offers.length} عرض وصلك</div>
        ${offers.map((o, i) => `
          <div class="offer-card ${i===0 ? 'best' : ''}">
            ${i===0 ? '<div class="best-badge">⭐ أفضل سعر</div>' : ''}
            <div class="offer-header">
              <div class="offer-avatar">${(o.artisan_name||'ح')[0]}</div>
              <div>
                <div class="offer-name">${o.artisan_name||''}</div>
                <div class="offer-city">📍 ${o.artisan_city||''}</div>
                <div class="offer-stars">${'★'.repeat(o.artisan_stars||1)}${'☆'.repeat(5-(o.artisan_stars||1))}</div>
              </div>
            </div>
            <div class="offer-details">
              <div class="offer-detail">
                <div class="offer-detail-label">السعر</div>
                <div class="offer-detail-value">${o.price} درهم</div>
              </div>
              <div class="offer-detail">
                <div class="offer-detail-label">وقت الوصول</div>
                <div class="offer-detail-value" style="font-size:14px;">${o.eta}</div>
              </div>
            </div>
            <a href="tel:${o.artisan_phone}" class="btn-call">📞 اتصل بـ ${o.artisan_name}</a>
          </div>
        `).join('')}
        <div style="text-align:center; margin-top:8px;">
          <button class="refresh-btn" onclick="loadOffers()">🔄 تحديث العروض</button>
        </div>
      `;
    } catch(e) {
      document.getElementById('offersSection').innerHTML = `<div class="empty-msg"><p>حدث خطأ: ${e.message}</p></div>`;
    }
  }

  loadOffers();
</script>
</body>
</html>
