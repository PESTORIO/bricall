<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>طلبات الزبناء — حرفي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #1a1a2e; --accent: #e8b84b; --bg: #f5f0e8; --card: #ffffff; --text: #1a1a2e; --muted: #6b6b7b; --border: #e0d8cc; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav { background: var(--primary); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
    .back-btn { color: white; text-decoration: none; font-size: 20px; }
    .logo { font-size: 22px; font-weight: 900; color: var(--accent); }
    .logo span { color: white; }
    .hero { background: var(--primary); padding: 28px 24px; text-align: center; }
    .hero h1 { font-size: 22px; font-weight: 900; color: white; margin-bottom: 6px; }
    .hero h1 span { color: var(--accent); }
    .hero p { font-size: 13px; color: rgba(255,255,255,0.7); }
    .container { max-width: 700px; margin: 0 auto; padding: 24px 16px; }
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-bar select { flex: 1; padding: 10px 14px; border: 2px solid var(--border); border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 14px; background: white; }
    .filter-bar button { padding: 10px 20px; background: var(--accent); color: var(--primary); border: none; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }
    .request-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 14px; }
    .request-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .request-problem { font-size: 18px; font-weight: 900; }
    .request-badge { background: var(--accent); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .request-meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .request-note { font-size: 13px; background: #f0ebe0; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; }
    .offers-count { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .offer-form { border-top: 1px solid var(--border); padding-top: 14px; }
    .offer-form label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 5px; }
    .offer-inputs { display: flex; gap: 10px; margin-bottom: 10px; }
    .offer-inputs input { flex: 1; padding: 10px 12px; border: 2px solid var(--border); border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 14px; }
    .btn-offer { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .btn-offer:disabled { opacity: 0.5; cursor: not-allowed; }
    .offer-sent { color: green; font-size: 13px; font-weight: 700; margin-top: 6px; }
    .empty-msg { text-align: center; padding: 48px; color: var(--muted); font-size: 16px; }
    .login-box { background: white; border-radius: 16px; padding: 28px 24px; max-width: 400px; margin: 40px auto; text-align: center; border: 1px solid var(--border); }
    .login-box h2 { font-size: 20px; font-weight: 900; margin-bottom: 16px; }
    .login-box input { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 14px; margin-bottom: 12px; }
    .btn-login { width: 100%; padding: 12px; background: var(--accent); color: var(--primary); border: none; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; }
    footer { background: var(--primary); color: rgba(255,255,255,0.6); text-align: center; padding: 24px; font-size: 13px; margin-top: 32px; }
    footer span { color: var(--accent); }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="back-btn">←</a>
  <div class="logo">حرفي<span>.</span></div>
</nav>

<div class="hero">
  <h1>طلبات <span>الزبناء</span></h1>
  <p>شوف الطلبات وأعطي عرضك — الزبون يختار الأحسن</p>
</div>

<div class="container">

  <!-- تسجيل دخول الحرفي -->
  <div id="loginSection">
    <div class="login-box">
      <h2>🔑 دخول الحرفي</h2>
      <p style="font-size:13px; color:var(--muted); margin-bottom:16px;">أدخل رقم هاتفك المسجل لتشوف الطلبات</p>
      <input type="tel" id="artisanPhone" placeholder="06XXXXXXXX" />
      <button class="btn-login" onclick="loginArtisan()">دخول ←</button>
      <div id="loginError" style="color:red; font-size:13px; margin-top:8px;"></div>
    </div>
  </div>

  <!-- لوحة الطلبات -->
  <div id="dashboardSection" style="display:none;">
    <div class="filter-bar">
      <select id="filterCity">
        <option value="">كل المدن</option>
        <option value="الدار البيضاء">الدار البيضاء</option>
        <option value="الرباط">الرباط</option>
        <option value="مراكش">مراكش</option>
        <option value="فاس">فاس</option>
        <option value="طنجة">طنجة</option>
        <option value="أكادير">أكادير</option>
      </select>
      <button onclick="loadRequests()">🔍 بحث</button>
    </div>
    <div id="requestsGrid"><div class="empty-msg">⏳ جاري التحميل...</div></div>
  </div>

</div>

<footer>صُنع بـ ❤️ للمغرب — <span>حرفي</span> © 2026</footer>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDqF510_qVbJxImCP94Sl9uE7srF2u1Cuk",
    authDomain: "hrafiy-app.firebaseapp.com",
    projectId: "hrafiy-app",
    storageBucket: "hrafiy-app.firebasestorage.app",
    messagingSenderId: "668315848262",
    appId: "1:668315848262:web:0323e4f8c932e040c80447"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let currentArtisan = null;

  async function loginArtisan() {
    const phone = document.getElementById('artisanPhone').value.trim();
    if (!phone) { document.getElementById('loginError').textContent = 'أدخل رقم هاتفك'; return; }

    try {
      const snap = await db.collection("artisans").where("phone", "==", phone).where("status", "==", "active").get();
      if (snap.empty) {
        document.getElementById('loginError').textContent = 'رقم الهاتف غير مسجل أو غير مفعّل';
        return;
      }
      currentArtisan = { id: snap.docs[0].id, ...snap.docs[0].data() };
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      loadRequests();
    } catch(e) {
      document.getElementById('loginError').textContent = 'حدث خطأ: ' + e.message;
    }
  }

  async function loadRequests() {
    const city = document.getElementById('filterCity').value;
    document.getElementById('requestsGrid').innerHTML = '<div class="empty-msg">⏳ جاري التحميل...</div>';

    try {
      let query = db.collection("requests")
        .where("specialty", "==", currentArtisan.specialty)
        .where("status", "==", "open")
        .orderBy("created_at", "desc");

      const snap = await query.get();
      let requests = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      if (city) requests = requests.filter(r => r.city === city);

      if (!requests.length) {
        document.getElementById('requestsGrid').innerHTML = '<div class="empty-msg">لا توجد طلبات حالياً</div>';
        return;
      }

      // شوف العروض اللي أرسلها هاد الحرفي
      const offersSnap = await db.collection("offers").where("artisan_id", "==", currentArtisan.id).get();
      const myOffers = new Set(offersSnap.docs.map(d => d.data().request_id));

      document.getElementById('requestsGrid').innerHTML = requests.map(r => {
        const timeAgo = r.created_at ? timeFromNow(r.created_at.toDate()) : '';
        const alreadySent = myOffers.has(r.id);
        return `
          <div class="request-card" id="card-${r.id}">
            <div class="request-header">
              <div class="request-problem">${r.problem}</div>
              <div class="request-badge">${r.specialty}</div>
            </div>
            <div class="request-meta">📍 ${r.city} &nbsp;|&nbsp; 🕐 ${timeAgo}</div>
            ${r.note ? `<div class="request-note">💬 ${r.note}</div>` : ''}
            <div class="offer-form">
              ${alreadySent
                ? `<div class="offer-sent">✅ أرسلت عرضك على هذا الطلب</div>`
                : `
                <label>عرضك (السعر بالدرهم + وقت الوصول)</label>
                <div class="offer-inputs">
                  <input type="number" id="price-${r.id}" placeholder="السعر (درهم)" min="0" />
                  <input type="text" id="eta-${r.id}" placeholder="وقت الوصول (مثال: 30 دقيقة)" />
                </div>
                <button class="btn-offer" id="btn-${r.id}" onclick="sendOffer('${r.id}', '${r.client_phone}')">📤 أرسل العرض</button>
              `}
            </div>
          </div>
        `;
      }).join('');
    } catch(e) {
      document.getElementById('requestsGrid').innerHTML = `<div class="empty-msg">حدث خطأ: ${e.message}</div>`;
    }
  }

  async function sendOffer(requestId, clientPhone) {
    const price = document.getElementById(`price-${requestId}`).value.trim();
    const eta = document.getElementById(`eta-${requestId}`).value.trim();
    if (!price || !eta) { alert('أدخل السعر ووقت الوصول'); return; }

    const btn = document.getElementById(`btn-${requestId}`);
    btn.disabled = true;
    btn.textContent = '⏳ جاري الإرسال...';

    try {
      await db.collection("offers").add({
        request_id: requestId,
        artisan_id: currentArtisan.id,
        artisan_name: currentArtisan.name,
        artisan_phone: currentArtisan.phone,
        artisan_stars: currentArtisan.stars || 1,
        artisan_city: currentArtisan.city,
        price: Number(price),
        eta: eta,
        created_at: firebase.firestore.FieldValue.serverTimestamp()
      });

      document.getElementById(`card-${requestId}`).querySelector('.offer-form').innerHTML =
        '<div class="offer-sent">✅ تم إرسال عرضك! الزبون سيتصل بك إذا اختارك</div>';
    } catch(e) {
      alert('حدث خطأ: ' + e.message);
      btn.disabled = false;
      btn.textContent = '📤 أرسل العرض';
    }
  }

  function timeFromNow(date) {
    const diff = Math.floor((Date.now() - date.getTime()) / 60000);
    if (diff < 1) return 'الآن';
    if (diff < 60) return `منذ ${diff} دقيقة`;
    if (diff < 1440) return `منذ ${Math.floor(diff/60)} ساعة`;
    return `منذ ${Math.floor(diff/1440)} يوم`;
  }
</script>
</body>
</html>
