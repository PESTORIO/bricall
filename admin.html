<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a2235;
      color: white;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .emoji { font-size: 80px; margin-bottom: 24px; animation: shake 0.5s ease-in-out infinite; }
    @keyframes shake {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
    h1 { font-size: 32px; font-weight: 900; color: #F9A825; margin-bottom: 16px; }
    p { font-size: 18px; color: rgba(255,255,255,0.7); line-height: 1.8; margin-bottom: 8px; }
    .small { font-size: 14px; color: rgba(255,255,255,0.3); margin-top: 24px; }
  </style>
</head>
<body>
  <div class="emoji">🕵️‍♂️</div>
  <h1>سير اتق الله! 😂</h1>
  <p>واش كنت كتقلب على شي؟ 🤨</p>
  <p>ما كاين والو هنا يا صاحبي! 😅</p>
  <p>روح دير شي مفيد في حياتك 🙏</p>
  <p class="small">🔒 محاولتك سجلات — مزيان تمشي دابا 👋</p>
</body>
</html>
